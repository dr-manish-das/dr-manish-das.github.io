        end_date: present
        summary: >
          Member of the J-PET group led by Prof. Paweł Moskal. Works on positronium lifetime
          imaging (PLI) with the modular plastic-scintillator J-PET tomograph: radionuclide
          selection for β⁺γ emitters, time-of-flight calibration, scatter and random correction
          methods, and image reconstruction for triple-coincidence data.
        highlights:
          - First experimental demonstration of positronium lifetime imaging with ⁴⁴Sc using the J-PET scanner.
          - First positronium imaging of ⁵²Mn and ⁵⁵Co in a plastic-based PET scanner.
          - Developed attenuation, random-coincidence and Monte Carlo scatter corrections for quantitative J-PET reconstruction.
          - Contributed to the first in-human image of quantum entanglement between annihilation photons.

