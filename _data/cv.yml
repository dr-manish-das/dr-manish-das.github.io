          Attenuation, delayed-time-window random correction and Monte Carlo scatter correction for
          quantitative image reconstruction on the modular J-PET with the NEMA IQ phantom.
          **First author.**

      - title: Monte Carlo-based scatter correction for the plastic-based modular PET scanner J-PET
        releaseDate: "2026"
