        publisher: Physics in Medicine & Biology 71(7) 075026
        summary: >
          GEANT4-based scatter correction for plastic-scintillator PET. **Equal contribution.**

      - title: Estimating the efficiency and purity for detecting annihilation and prompt photons for positronium imaging with J-PET using toy Monte Carlo simulation
        releaseDate: "2023"
        url: https://doi.org/10.5604/01.3001.0054.1938
        publisher: Bio-Algorithms and Med-Systems 19(1) 87–95
        summary: >
          Toy Monte Carlo study identifying the energy threshold that maximises prompt-γ efficiency
          and annihilation-γ purity across candidate β⁺γ radionuclides. **First author.**

      - title: First experimental demonstration of positronium lifetime imaging with ⁴⁴Sc using the J-PET scanner
        releaseDate: "2025"
        url: https://arxiv.org/abs/2506.07230
        publisher: IEEE Nuclear Science Symposium (NSS) / Medical Imaging Conference (MIC) / RTSD
        summary: >
          Conference proceeding reporting the first-ever PLI demonstration with ⁴⁴Sc, produced at
          the Heavy Ion Laboratory in Warsaw and measured with triggerless data acquisition.
          **First author.**

      - title: Performance evaluation of the modular J-PET detector in conventional PET imaging
