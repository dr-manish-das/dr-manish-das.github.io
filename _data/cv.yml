    Publications:
      - title: "First positronium imaging using ⁴⁴Sc with the J-PET scanner: a case study on the NEMA-image quality phantom"
        releaseDate: "2026"
        url: https://doi.org/10.1109/TRPMS.2025.3621554
        publisher: IEEE Transactions on Radiation and Plasma Medical Sciences 10(4) 593
        summary: >
          First experimental positronium imaging with ⁴⁴Sc, exploiting its 100% prompt-γ yield
