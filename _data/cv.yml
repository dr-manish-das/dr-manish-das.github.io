      - title: First positronium lifetime imaging using ⁵²Mn and ⁵⁵Co with a plastic-based PET scanner
        releaseDate: "2026"
        url: https://doi.org/10.1038/s41598-026-43965-z
        publisher: Scientific Reports 16, 16230
        summary: >
          First positronium lifetime imaging with ⁵²Mn and ⁵⁵Co, comparing efficiency and spectral
