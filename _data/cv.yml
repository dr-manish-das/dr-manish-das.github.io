cv:
  name: Manish Das
  label: Doctoral Researcher in Experimental Medical Physics
  email: manishdasind@gmail.com
  phone: "+48 12 664 4593"
  location: Kraków, Poland
  website: https://koza.if.uj.edu.pl/staff/mdas
  image: ""

  summary: >
    Experimental physicist working on **positronium imaging** — a new PET modality that images the
    lifetime of positronium atoms inside tissue as a probe of submolecular structure and oxygenation.
    Part of the **J-PET** research group at the Jagiellonian University in Kraków, where the
    plastic-scintillator J-PET scanners are developed. Author of 25 papers on PET detector
    corrections, radionuclide selection for triple-coincidence imaging, positronium lifetime
    reconstruction and tests of fundamental symmetries with annihilation photons. First-author
    and equal-contribution work covers positronium lifetime imaging with the novel ⁴⁴Sc, ⁵²Mn and
    ⁵⁵Co radionuclides, Monte Carlo scatter correction for the modular J-PET, and the first
    experimental PLI demonstration with ⁴⁴Sc.

